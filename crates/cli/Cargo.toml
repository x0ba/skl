[package]
name = "skl"
version = "0.1.0"
edition = "2021"
description = "Personal agent skill sync CLI"
license = "MIT"

[[bin]]
name = "skl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
dialoguer = "0.11"
dirs = "5"
hex = "0.4"
humantime = "2"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
toml = "0.8"
walkdir = "2"
whoami = "1.5"

# Legacy migrate-once only. Normal login/logout uses state.db and does not
# need DBus / Secret Service. Native backends (keyutils / Keychain /
# Credential Manager) compile without libdbus — including musl.
# Enable `legacy-secret-service` to also read leftover GNOME/KDE keyring
# entries (needs libdbus-1-dev at compile time).
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }

[features]
default = []
legacy-secret-service = ["keyring/sync-secret-service"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

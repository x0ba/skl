[package]
name = "skl"
version = "0.1.0"
edition = "2021"
description = "Personal agent skill sync CLI"
license = "MIT"

[[bin]]
name = "skl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
hex = "0.4"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
toml = "0.8"
walkdir = "2"
whoami = "1.5"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

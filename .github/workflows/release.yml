# Tag-only entry point so v* publishes even when the tagged commit
# does not match cli-binaries path filters. Reuses that workflow as-is
# (same cross-compile.sh + matrix + SHA256SUMS + install.sh).
# cli-binaries.yml ignores tag pushes so this is the only publisher.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    uses: ./.github/workflows/cli-binaries.yml
    permissions:
      contents: write
